name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render's free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s "https://sports-facility-ai-copilot.onrender.com/insights" > /dev/null
        # Hitting a lightweight endpoint to keep the server warm
